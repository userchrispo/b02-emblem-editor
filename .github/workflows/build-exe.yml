name: Build exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: |
          pyinstaller --onefile --name BO2EmblemToolkit --add-data "reference_shapes;reference_shapes" --add-data "emblemtool/web/static;emblemtool/web/static" --add-data "LICENSE;." run.py
      - uses: actions/upload-artifact@v4
        with:
          name: BO2EmblemToolkit
          path: dist/BO2EmblemToolkit.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BO2EmblemToolkit.exe
